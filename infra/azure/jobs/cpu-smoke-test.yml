$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

type: command
display_name: foliascan-cpu-smoke-test
experiment_name: foliascan-training
description: >
  Small CPU command job that validates the FoliaScan code, Azure data inputs,
  curated environment, training loop, and managed output.

code: ../../..

command: >-
  python -m foliascan.training.train
  --manifest ${{inputs.manifest}}
  --data-dir ${{inputs.images}}
  --config configs/training.example.yaml
  --output-dir ${{outputs.training_output}}
  --device cpu
  --epochs 1
  --max-train-batches 2
  --max-validation-batches 1
  --enable-mlflow

environment: azureml:AzureML-acpt-pytorch-2.8-cuda12.6:15
compute: azureml:cpu-fs-dev

environment_variables:
  PYTHONPATH: src
  PYTHONUNBUFFERED: "1"

inputs:
  images:
    type: uri_folder
    path: azureml:foliascan-tomato-images:1
    mode: ro_mount

  manifest:
    type: uri_file
    path: azureml:foliascan-dataset-manifest:1
    mode: ro_mount

outputs:
  training_output:
    type: uri_folder
    mode: rw_mount

limits:
  timeout: 1800

tags:
  project: foliascan
  stage: cpu-smoke-test
  data-version: "1"
  environment-family: acpt-pytorch-2.8-cuda12.6
