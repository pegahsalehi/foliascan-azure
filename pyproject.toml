[tool.poetry]
name = "foliascan-azure"
version = "0.1.0"
description = "FoliaScan is a learning and portfolio project for crop-leaf disease image classification."
authors = ["FoliaScan Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "foliascan", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
torch = ">=2.3,<3.0"
torchvision = ">=0.18,<1.0"
pillow = ">=10.3,<12.0"
numpy = ">=1.26,<3.0"
pandas = ">=2.2,<3.0"
scikit-learn = ">=1.5,<2.0"
matplotlib = ">=3.9,<4.0"
pyyaml = ">=6.0,<7.0"
datasets = ">=2.20,<4.0"
huggingface-hub = ">=0.24,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2,<9.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.5,<0.15"
mypy = ">=1.10,<2.0"

[build-system]
requires = ["poetry-core>=1.9.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["foliascan"]
strict = true
warn_unused_configs = true
